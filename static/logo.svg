<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2854b8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#badge)"/>

  <!-- links from hub to hosts -->
  <g stroke="#e6e8eb" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="32" x2="32" y2="16"/>
    <line x1="32" y1="32" x2="46" y2="40"/>
    <line x1="32" y1="32" x2="18" y2="40"/>
  </g>

  <!-- host nodes -->
  <circle cx="32" cy="14" r="5" fill="#0f1115"/>
  <circle cx="32" cy="14" r="5" fill="#e6e8eb" opacity="0.95"/>
  <circle cx="48" cy="42" r="5" fill="#e6e8eb" opacity="0.95"/>
  <circle cx="16" cy="42" r="5" fill="#e6e8eb" opacity="0.95"/>

  <!-- hub node (this manager) -->
  <circle cx="32" cy="32" r="7.5" fill="#0f1115"/>
  <circle cx="32" cy="32" r="6" fill="#ffffff"/>
</svg>
